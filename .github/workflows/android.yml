name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache-dependency-path: third_party/libgocryptfs/go.sum
    - name: Install Android toolchain
      run: |
        set +o pipefail
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        set -o pipefail
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          "platforms;android-37.2" "build-tools;37.0.0" \
          "ndk;30.0.16248370" "cmake;3.22.1"
    - name: Build and check Android
      run: ./gradlew assembleDebug testDebugUnitTest lintDebug
    - name: Check Mac bridge protocol
      run: python3 -m unittest discover -s mac -v
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: fileweave-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 10
